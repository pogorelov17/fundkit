line-length = 110
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "RUF", "PT", "C4", "RET", "SIM", "PTH", "N"]
ignore = [
    "PLR2004", # magic values: the tests compare against literal protocol values on purpose
    "PT009",   # unittest-style assertions: the suite is unittest, not pytest
    "PT027",
]

[lint.pylint]
max-args = 6

[format]
quote-style = "double"
